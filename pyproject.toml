[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerre-tts"
version = "0.1.0"
description = "A small Turkish text-to-speech model trained from scratch, with language packs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4,<3",
    "numpy>=1.24,<3",
    "soundfile>=0.12,<1",
    "filelock>=3.13,<4",
]

[project.optional-dependencies]
prepare = ["librosa>=0.10.2,<1", "pyarrow>=15", "soxr>=0.3,<2", "datasets>=2.20,<5", "huggingface-hub>=0.34,<2"]
# Forced alignment and annotation: a phoneme recogniser, used to label data only.
annotate = ["transformers>=4.40,<5", "torchaudio>=2.1,<3", "scipy>=1.10,<2", "huggingface-hub>=0.34,<2"]
evaluate = ["faster-whisper>=1.0,<2", "jiwer>=3,<5", "librosa>=0.10.2,<1", "scipy>=1.10,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
zerre-prepare = "zerre.prepare:main"
zerre-annotate = "zerre.annotate:main"
zerre-train = "zerre.train:main"
zerre-evaluate = "zerre.evaluate:main"
zerre-speak = "zerre.infer:main"
zerre-inspect = "zerre.inspect:main"
zerre-export = "zerre.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
